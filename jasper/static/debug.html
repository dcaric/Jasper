<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jasper - AI Debug Logs</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <style>
        .debug-container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 20px;
            background: #1a1a1a;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
            color: #e0e0e0;
        }
        .debug-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid #333;
            padding-bottom: 15px;
        }
        .log-list {
            list-style: none;
            padding: 0;
            font-family: 'Fira Code', monospace;
            font-size: 13px;
            overflow-y: auto;
            max-height: 70vh;
        }
        .log-item {
            padding: 8px 12px;
            border-bottom: 1px solid #222;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .log-item:hover {
            background: #252525;
        }
        .type-tag {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            margin-right: 8px;
            text-transform: uppercase;
        }
        .tag-intent { background: #3b82f6; color: white; }
        .tag-chat { background: #10b981; color: white; }
        .tag-gemini { background: #8b5cf6; color: white; }
        .tag-error { background: #ef4444; color: white; }
        
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .btn {
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid #333;
            background: #222;
            color: #ccc;
            cursor: pointer;
            font-size: 13px;
        }
        .btn:hover { background: #333; }
        .btn.active {
            background: #3b82f6;
            color: white;
            border-color: #3b82f6;
        }
        .back-link {
            text-decoration: none;
            color: #3b82f6;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 5px;
        }
    </style>
</head>
<body>
    <div class="debug-container">
        <header class="debug-header">
            <a href="/" class="back-link">← Back to Chat</a>
            <h1>AI Debug Logs</h1>
            <button onclick="fetchLogs()" class="btn">Refresh</button>
        </header>
        
        <div class="controls" id="filter-controls">
            <button class="btn active" onclick="setFilter('all')">All</button>
            <button class="btn" onclick="setFilter('INTENT')">Intents (Gemma-270M)</button>
            <button class="btn" onclick="setFilter('CHAT')">Chat (Gemma-4B)</button>
            <button class="btn" onclick="setFilter('GEMINI')">Cloud (Gemini)</button>
        </div>

        <ul id="log-list" class="log-list">
            <li class="log-item">Loading logs...</li>
        </ul>
    </div>

    <script>
        let currentFilter = 'all';
        let allLogs = [];

        async function fetchLogs() {
            try {
                const resp = await fetch('/api/logs');
                const data = await resp.json();
                allLogs = data.logs || [];
                renderLogs();
            } catch (e) {
                document.getElementById('log-list').innerHTML = `<li class="log-item tag-error">Error fetching logs: ${e.message}</li>`;
            }
        }

        function setFilter(filter) {
            currentFilter = filter;
            document.querySelectorAll('#filter-controls .btn').forEach(btn => {
                btn.classList.toggle('active', btn.innerText.toLowerCase().includes(filter.toLowerCase()) || (filter === 'all' && btn.innerText === 'All'));
            });
            renderLogs();
        }

        function renderLogs() {
            const list = document.getElementById('log-list');
            list.innerHTML = '';
            
            const filtered = allLogs.filter(log => {
                if (currentFilter === 'all') return true;
                return log.includes(`[${currentFilter}]`);
            });

            if (filtered.length === 0) {
                list.innerHTML = '<li class="log-item">No logs found for this filter.</li>';
                return;
            }

            filtered.forEach(log => {
                const li = document.createElement('li');
                li.className = 'log-item';
                
                // Colorize tags
                let html = log.replace(/\[(INTENT|CHAT|GEMINI|ERROR)\]/g, (match, p1) => {
                    return `<span class="type-tag tag-${p1.toLowerCase()}">${p1}</span>`;
                });
                
                li.innerHTML = html;
                list.appendChild(li);
            });
        }

        // Auto-refresh every 5 seconds
        fetchLogs();
        setInterval(fetchLogs, 5000);
    </script>
</body>
</html>
