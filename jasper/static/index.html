<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jasper - AI Email Assistant</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>

<body>
    <div class="app-container">
        <header class="app-header">
            <div class="user-info">
                <div class="avatar">
                    <img src="/static/jasper.png" alt="Jasper">
                </div>
                <div class="status-info">
                    <h1>Jasper</h1>
                    <div class="status-container">
                        <p class="status">Uses: Gemma3:4B, Chromadb & Gemini3</p>
                        <div id="index-meta" class="index-meta" style="display: none;">
                            <span id="index-pct">0%</span> Indexed
                            <div class="progress-mini">
                                <div id="index-bar" class="progress-bar-fill"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="header-actions" style="display: flex; gap: 10px;">
                <button id="refresh-index-btn" title="Refresh Semantic Index (Process Files)">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                        <path
                            d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z">
                        </path>
                    </svg>
                </button>
                <button id="debug-btn" title="AI Debug Logs" onclick="window.open('/static/debug.html', '_blank')">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                        <path
                            d="M20 8h-2.81c-.45-.78-1.07-1.45-1.82-1.96L17 4.41 15.59 3l-2.17 2.17C12.96 5.06 12.49 5 12 5c-.49 0-.96.06-1.41.17L8.41 3 7 4.41l1.62 1.63C7.88 6.55 7.26 7.22 6.81 8H4v2h2.09c-.05.33-.09.66-.09 1v1H4v2h2v1c0 .34.04.67.09 1H4v2h2.81c.46.78 1.07 1.45 1.82 1.96L7 21.59 8.41 23l2.17-2.17c.45.11.92.17 1.42.17.49 0 .96-.06 1.41-.17L15.59 23 17 21.59l-1.62-1.63c.75-.51 1.37-1.18 1.82-1.96H20v-2h-2.09c.05-.33.09-.66.09-1v-1h2v-2h-2v-1c0-.34-.04-.67-.09-1H20V8zm-6 8h-4v-2h4v2zm0-4h-4v-2h4v2z">
                        </path>
                    </svg>
                </button>
                <button id="restart-btn" title="Restart Jasper Service">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                        <path
                            d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z">
                        </path>
                    </svg>
                </button>
            </div>
        </header>

        <div id="chat-window" class="chat-window">
            <div class="message system">
                <div class="bubble">
                    Welcome! I'm Jasper, your AI assistant. I can help you search your Gmail. Try asking something like:
                    "find mail from dario" or
                    "search for subject news".
                </div>
            </div>
        </div>

        <footer class="input-area">
            <form id="chat-form">
                <input type="text" id="user-input" placeholder="Type a message..." autocomplete="off">
                <button type="submit" id="send-btn">
                    <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
                        <path d="M1.101 21.757L23.8 12.028 1.101 2.3l.011 7.912 13.623 1.816-13.623 1.817-.011 7.912z">
                        </path>
                    </svg>
                </button>
            </form>
        </footer>
    </div>
    <div id="restart-overlay" class="restart-overlay">
        <div class="overlay-content">
            <div class="spinner"></div>
            <p>Restarting Jasper...</p>
            <p class="subtext">Applying fixes and clearing memory...</p>
        </div>
    </div>
    <script src="/static/script.js?v=3"></script>
</body>

</html>
